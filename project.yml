name: Wandering
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Wandering:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aman.wandering
        PRODUCT_NAME: Wandering
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # idevice FFI (built in Aman122608/wander-free, downloaded into vendor/)
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/vendor/include
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/vendor/include
          - $(SRCROOT)/Sources/Transport
          - $(SRCROOT)/Support
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/vendor
        OTHER_LDFLAGS: $(inherited) -lidevice_ffi
        SWIFT_OBJC_BRIDGING_HEADER: Support/Bridging.h
        CLANG_ENABLE_MODULES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
